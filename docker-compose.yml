services:
  reuniator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reuniator
    restart: unless-stopped
    ports:
      - "127.0.0.1:6742:6742"
    volumes:
      - ./dev.db:/app/prisma/dev.db
    environment:
      - NODE_ENV=production
      - TURNSTILE_ENABLED=${TURNSTILE_ENABLED:-false}
      - TURNSTILE_SITE_KEY=${TURNSTILE_SITE_KEY:-}
      - TURNSTILE_SECRET=${TURNSTILE_SECRET:-}
      - TURNSTILE_HOSTNAMES=${TURNSTILE_HOSTNAMES:-reuniator.bru.to}
    env_file:
      - .env
